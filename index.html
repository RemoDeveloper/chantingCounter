<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Chanting Tracker — Multiuser</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto Slab', serif;
      background: linear-gradient(135deg, #fff8e7, #f7f7f7);
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
    }

    .progress {
      height: 25px;
      max-width: 600px;
      margin: auto;
    }

    #calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(100px, 1fr));
      gap: 10px;
      min-width: 700px;
    }

    .header {
      font-weight: bold;
      text-align: center;
      padding: 5px;
      background: #81d4fa;
      border-radius: 6px;
    }

    .day {
      background: white;
      border-radius: 12px;
      padding: 12px;
      min-height: 70px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, .15);
      transition: transform .2s ease, background .3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(.7);
      background: rgba(255, 255, 255, .97);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      display: none;
      z-index: 1000;
      line-height: 1.6;
    }

    #popup.show {
      display: block;
      animation: popIn .5s ease forwards, glow 1.5s infinite alternate;
    }

    @keyframes popIn {
      from {
        transform: translate(-50%, -50%) scale(.3);
        opacity: 0
      }

      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #ff8a65
      }

      to {
        text-shadow: 0 0 15px #ff3d00
      }
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #666;
    }

    @media(max-width:576px) {
      .day {
        min-height: 80px;
        font-size: 14px
      }

      #roundInput {
        width: 80%
      }

      #inputBox button {
        width: 80%
      }

      #popup {
        font-size: 18px;
        padding: 15px 20px
      }
    }

    /* Auth card */
    #authCard {
      max-width: 420px;
      margin: 0 auto 20px auto;
    }
  </style>
</head>

<body>
  <h1>📿 Chanting Tracker</h1>

  <!-- Authentication Card -->
  <div id="authArea" class="mb-3">
    <div id="authCard" class="card p-3 shadow-sm">
      <div id="signedOutUI">
        <h5 class="mb-3">Sign in with phone</h5>
        <input id="nameInput" class="form-control mb-2" placeholder="Your name" />
        <input id="phoneInput" class="form-control mb-2" placeholder="+91xxxxxxxxxx" />
        <div id="recaptcha-container" class="mb-2"></div>
        <button id="sendOtpBtn" class="btn btn-primary mb-2">Send OTP</button>

        <div id="otpFlow" style="display:none;">
          <input id="otpInput" class="form-control mb-2" placeholder="Enter OTP" />
          <button id="verifyOtpBtn" class="btn btn-success">Verify OTP & Sign in</button>
        </div>
        <small class="text-muted d-block mt-2">Your phone will be used for login only. No spam.</small>
      </div>

      <div id="signedInUI" style="display:none;">
        <div class="d-flex justify-content-between align-items-center">
          <div><strong id="displayName"></strong><br /><small id="displayPhone"></small></div>
          <div><button id="signOutBtn" class="btn btn-outline-secondary btn-sm">Sign out</button></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Monthly Progress -->
  <div id="monthlyProgress" class="text-center" style="display:none;">
    <h5>Total rounds this month: <span id="monthlyTotal">0</span></h5>
    <div class="progress">
      <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar"
        style="width:0%">0%</div>
    </div>
  </div>

  <!-- Month navigation -->
  <div id="navArea" class="d-flex justify-content-between align-items-center mb-3 flex-wrap" style="display:none;">
    <button class="btn btn-outline-primary mb-2" onclick="prevMonth()">⟵ Back</button>
    <div id="monthYear" class="fs-4 fw-bold text-center flex-grow-1 mb-2"></div>
    <button class="btn btn-outline-primary mb-2" onclick="nextMonth()">Next ⟶</button>
  </div>

  <!-- Calendar -->
  <div id="calendarContainer" style="display:none;">
    <div id="calendar"></div>
  </div>

  <!-- Input Box -->
  <div id="inputBox" class="mt-4" style="display:none; text-align:center;">
    <h3 id="selectedDate"></h3>
    <input type="number" id="roundInput" class="form-control d-inline-block mb-2" placeholder="Rounds" />
    <button class="btn btn-success ms-2" id="saveBtn">Save</button>
  </div>

  <!-- Popup -->
  <div id="popup"></div>

  <div class="footer">
    &copy; 2025 Chanting Tracker developed by Ramesh Phatak. All rights reserved.
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { app, auth, db } from "./firebase-config.js";
    import { RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // ---------------- AUTH ----------------
    let confirmationResult, currentUser;

    // reCAPTCHA setup
    window.recaptchaVerifier = new RecaptchaVerifier('recaptcha-container', {}, auth);

    // Send OTP
    document.getElementById("sendOtpBtn").addEventListener("click", async () => {
      const phone = document.getElementById("phoneInput").value;
      const name = document.getElementById("nameInput").value;
      if (!phone || !name) { alert("Enter name and phone"); return; }

      try {
        confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
        document.getElementById("otpFlow").style.display = "block";
        alert("OTP sent!");
      } catch (err) { alert("Error: " + err.message); }
    });

    // Verify OTP
    document.getElementById("verifyOtpBtn").addEventListener("click", async () => {
      const code = document.getElementById("otpInput").value;
      try {
        const result = await confirmationResult.confirm(code);
        currentUser = result.user;
        const name = document.getElementById("nameInput").value;

        // Save user data in Firestore
        await setDoc(doc(db, "users", currentUser.uid), { username: name, mobile: currentUser.phoneNumber, rounds: {} }, { merge: true });
      } catch (err) { alert("Invalid OTP"); }
    });

    // Sign out
    document.getElementById("signOutBtn").addEventListener("click", async () => { await signOut(auth); });

    // Auth state change
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("signedOutUI").style.display = "none";
        document.getElementById("signedInUI").style.display = "block";
        const data = (await getDoc(doc(db, "users", user.uid))).data();
        document.getElementById("displayName").textContent = data?.username || "Anonymous";
        document.getElementById("displayPhone").textContent = user.phoneNumber;

        // Show app
        document.getElementById("monthlyProgress").style.display = "block";
        document.getElementById("navArea").style.display = "flex";
        document.getElementById("calendarContainer").style.display = "block";
        document.getElementById("inputBox").style.display = "block";

        loadCalendar();
      } else {
        currentUser = null;
        document.getElementById("signedOutUI").style.display = "block";
        document.getElementById("signedInUI").style.display = "none";

        document.getElementById("monthlyProgress").style.display = "none";
        document.getElementById("navArea").style.display = "none";
        document.getElementById("calendarContainer").style.display = "none";
        document.getElementById("inputBox").style.display = "none";
      }
    });

    // ---------------- CALENDAR & ROUNDS ----------------
    const calendar = document.getElementById("calendar");
    const monthYear = document.getElementById("monthYear");
    const inputBox = document.getElementById("inputBox");
    const selectedDateElem = document.getElementById("selectedDate");
    const roundInput = document.getElementById("roundInput");
    const popup = document.getElementById("popup");
    const monthlyTotalElem = document.getElementById("monthlyTotal");
    const progressBar = document.getElementById("progressBar");

    let current = new Date();
    let selectedDate = null;

    function getIcon(rounds) {
      if (rounds >= 16) return '<i class="bi bi-stars text-warning"></i>';
      if (rounds >= 12) return '<i class="bi bi-feather text-primary"></i>';
      if (rounds >= 8) return '<i class="bi bi-flower1 text-danger"></i>';
      if (rounds >= 4) return '<i class="bi bi-gem text-success"></i>';
      return '<i class="bi bi-heart text-info"></i>';
    }

    async function loadCalendar() {
      if (!currentUser) return;

      calendar.innerHTML = "";
      const year = current.getFullYear();
      const month = current.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      monthYear.innerText = current.toLocaleString('default', { month: 'long' }) + " " + year;

      // Week headers
      ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d => {
        let div = document.createElement("div");
        div.classList.add("header");
        div.innerText = d;
        calendar.appendChild(div);
      });

      // Empty slots
      for (let i = 0; i < firstDay; i++) calendar.appendChild(document.createElement("div"));

      const userDoc = await getDoc(doc(db, "users", currentUser.uid));
      const roundsData = userDoc.data()?.rounds || {};

      for (let d = 1; d <= lastDate; d++) {
        let div = document.createElement("div");
        div.classList.add("day");
        let saved = roundsData[`${year}-${month}-${d}`] || 0;
        let icon = getIcon(saved);
        div.innerHTML = `<strong>${d}</strong><div class="rounds">${saved>0?saved+" rounds":""} ${icon}</div>`;
        div.onclick = () => openInput(year, month, d);
        calendar.appendChild(div);
      }

      updateMonthlyTotal(roundsData, year, month, lastDate);
    }

    function openInput(year, month, day) {
      selectedDate = { year, month, day };
      selectedDateElem.innerHTML = `Add rounds for ${day}-${month + 1}-${year}`;
      roundInput.value = "";
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      if (!selectedDate || !currentUser) return;
      const val = parseInt(roundInput.value) || 0;
      const key = `${selectedDate.year}-${selectedDate.month}-${selectedDate.day}`;
      const userRef = doc(db, "users", currentUser.uid);

      // Save rounds
      const userDoc = await getDoc(userRef);
      let roundsData = userDoc.data()?.rounds || {};
      roundsData[key] = val;
      await setDoc(userRef, { rounds: roundsData }, { merge: true });

      // Refresh calendar
      loadCalendar();
      showPopup(val);
    });

    function showPopup(rounds) {
      let icon = getIcon(rounds);
      let message = rounds>=16?"Hari Bol 🙌":rounds>=12?"Radhe Radhe 💖":rounds>=8?"Hare Krishna 🌸":rounds>=4?"Shrila Prabhupad ki Jay 🙏":"Hare Krishna 🕊️";
      popup.innerHTML = icon + "<br>" + message;
      popup.classList.add("show");
      setTimeout(() => { popup.classList.remove("show"); popup.style.display = "none"; }, 4000);
    }

    function updateMonthlyTotal(roundsData, year, month, lastDate) {
      let total=0;
      for(let d=1;d<=lastDate;d++){
        total += roundsData[`${year}-${month}-${d}`]||0;
      }
      monthlyTotalElem.innerText = total;
      const monthlyGoal = 16*lastDate;
      const percent = Math.min((total/monthlyGoal)*100,100);
      progressBar.style.width = percent+"%";
      progressBar.innerText = Math.round(percent)+"%";
    }

    function prevMonth(){ current.setMonth(current.getMonth()-1); loadCalendar(); }
    function nextMonth(){ current.setMonth(current.getMonth()+1); loadCalendar(); }
  </script>

  <!-- Firebase config -->
  <script type="module" src="./firebase-config.js"></script>
</body>
</html>
